apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: apache/kafka:3.9.1
          command:
            - /bin/bash
            - -ec
            - |
              echo "Waiting for Kafka..."

              until /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server kafka:29092 >/dev/null 2>&1; do
                sleep 3
              done

              echo "Creating measurements topic..."

              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:29092 \
                --create \
                --if-not-exists \
                --topic measurements \
                --partitions 1 \
                --replication-factor 1

              echo "Kafka initialization completed."